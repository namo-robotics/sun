// moon.proto — Module metadata for .moon library bundles
// Reuses AST node definitions for type-safe serialization

syntax = "proto3";

/** Groups the serialized compiler data defined by this schema. */
package sun.moon;

import "ast.proto";
import "compatibility.proto";

option cc_enable_arenas = true;

/** Declaration roles, with values matching the compiler's DeclarationKind. */
enum DeclarationKind {
  MODULE = 0;
  FUNCTION = 1;
  LAMBDA = 2;
  CLASS = 3;
  INTERFACE = 4;
  ENUM = 5;
  VARIABLE = 6;
  REFERENCE = 7;
  PARAMETER = 8;
  TYPE_PARAMETER = 9;
  LIFETIME_PARAMETER = 10;
  FIELD = 11;
  VARIANT = 12;
  BINDING = 13;
  ALIAS = 14;
}

/**
 * Original declaration ownership, independent of import aliases and load order.
 */
message DeclarationRecord {
  string key = 1;
  DeclarationKind kind = 2;
  string name = 3;
  string owner = 4;
  string module = 5;
}

/** References a compiled bitcode image and its module declarations. */
message LibraryModule {
  ModuleMetadata metadata = 1;
  uint64 bitcode_offset = 2;
  uint64 bitcode_size = 3;
}

/** Identifies an embedded native archive and its byte range in the container. */
message LibraryArchive {
  string archive_set_hash = 1;
  string name = 2;
  uint64 offset = 3;
  uint64 size = 4;
}

/** Describes a complete library; large compiled payloads remain external byte ranges. */
message MoonLibrary {
  sun.abi.proto.BundleContract bundle_contract = 1;
  string content_hash = 2;
  repeated LibraryModule modules = 3;
  repeated LibraryArchive native_archives = 4;
  // Human-readable name, excluded from compatibility decisions.
  optional string version_name = 5;
}

/**
 * Module metadata stored in .moon bundle files.
 */
message ModuleMetadata {
  reserved 21; // Bundle contracts now belong to MoonLibrary.
  reserved "bundle_contract";
  repeated string module_declarations = 17;
  repeated DeclarationRecord declarations = 18;
  // Compile-only C binding requirements, rechecked in every importing target.
  repeated sun.proto.ast.ASTNode c_binding_assertions = 20;
  reserved 16;  // Former module binding table; references now carry canonical names.
  // Source identification
  string source_hash = 1;     // Unique key for this declaration entry
  string module_name = 2;     // Namespace name (e.g., "sun")
  reserved 3;
  reserved "version";
  string content_hash = 4;    // Bundle-wide hash for symbol isolation

  // Dependencies
  repeated string dependencies = 5;  // Paths to imported modules

  // Where this bundle's startup function runs relative to others: zero for a
  // bundle that imports nothing, otherwise one more than the highest value
  // among its imports. Lower values run first, so a library's globals are
  // initialized before the globals of anything that imports it.
  uint32 static_init_order = 19;

  // Source imports retain their target and file identity within this module.
  reserved 11;
  repeated sun.proto.ast.ASTNode using_declarations = 15;

  // Target the bitcode was compiled for (LLVM triple, e.g.
  // "x86_64-pc-linux-gnu"). Linking a bundle into a different target is an
  // error — struct layouts and ABI decisions are baked into the bitcode.
  string target_triple = 10;

  // The module's own visibility. Bundle-private items are carried (generic
  // bodies shipped in the bundle may reference them) but importers cannot
  // reach them; every top-level module of a bundle must be public.
  sun.proto.ast.Visibility visibility = 12;

  // Exported definitions (bodies included only for generics)
  repeated sun.proto.ast.FunctionDef functions = 6;
  repeated sun.proto.ast.ClassDef classes = 7;
  repeated sun.proto.ast.InterfaceDef interfaces = 8;
  repeated sun.proto.ast.EnumDef enums = 9;

  // Module-level variables. The initializer is dropped: the storage lives in
  // this bundle's bitcode, already initialized, and importers reference it.
  // Private ones are carried like other private items — bodies shipped in the
  // bundle may read them — but importers cannot reach them.
  repeated sun.proto.ast.VariableCreation globals = 13;

  // Absolute path of the source file the module was extracted from. Positions
  // inside the exported definitions are offsets into that file; editors use
  // it to open the declaration behind an imported symbol.
  string source_path = 14;
}
