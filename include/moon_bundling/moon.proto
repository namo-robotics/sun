// moon.proto — Module metadata for .moon library bundles
// Reuses AST node definitions for type-safe serialization

syntax = "proto3";

package sun.moon;

import "ast.proto";

option cc_enable_arenas = true;

// Module metadata stored in .moon bundle files.
message ModuleMetadata {
  reserved 16;  // Former module binding table; references now carry canonical names.
  // Source identification
  string source_hash = 1;     // Unique key for this declaration entry
  string module_name = 2;     // Namespace name (e.g., "sun")
  string version = 3;         // Semantic version (e.g., "1.0.0")
  string content_hash = 4;    // Bundle-wide hash for symbol isolation

  // Dependencies
  repeated string dependencies = 5;  // Paths to imported modules

  // Source imports retain their target and file identity within this module.
  reserved 11;
  repeated sun.ast.ASTNode using_declarations = 15;

  // Target the bitcode was compiled for (LLVM triple, e.g.
  // "x86_64-pc-linux-gnu"). Linking a bundle into a different target is an
  // error — struct layouts and ABI decisions are baked into the bitcode.
  string target_triple = 10;

  // The module's own visibility. Bundle-private items are carried (generic
  // bodies shipped in the bundle may reference them) but importers cannot
  // reach them; every top-level module of a bundle must be public.
  sun.ast.Visibility visibility = 12;

  // Exported definitions (bodies included only for generics)
  repeated sun.ast.FunctionDef functions = 6;
  repeated sun.ast.ClassDef classes = 7;
  repeated sun.ast.InterfaceDef interfaces = 8;
  repeated sun.ast.EnumDef enums = 9;

  // Module-level variables. The initializer is dropped: the storage lives in
  // this bundle's bitcode, already initialized, and importers reference it.
  // Private ones are carried like other private items — bodies shipped in the
  // bundle may read them — but importers cannot reach them.
  repeated sun.ast.VariableCreation globals = 13;

  // Absolute path of the source file the module was extracted from. Positions
  // inside the exported definitions are offsets into that file; editors use
  // it to open the declaration behind an imported symbol.
  string source_path = 14;
}
