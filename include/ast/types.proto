// types.proto — Core types for AST serialization
// Colocated with type_annotation.h, position.h

syntax = "proto3";

package sun.ast;

option cc_enable_arenas = true;

// Source location (mirrors Position struct in position.h)
message Position {
  int32 line = 1;
  int32 column = 2;
  int32 offset = 3;
  optional string file_path = 4;
  optional int32 end_line = 5;
  optional int32 end_column = 6;
  optional int32 end_offset = 7;
}

// Stable identity of an original nominal declaration.
message QualifiedName {
  repeated string scope_path = 1;
  string base_name = 2;
  string param_suffix = 3;
  repeated string module_path = 4;
}

// Type annotation (mirrors TypeAnnotation in type_annotation.h)
// Recursive structure for parsed type syntax
message TypeAnnotation {
  optional QualifiedName qualified_name = 12;
  string base_name = 1;                         // "i32", "f64", "ptr", "fn", etc.
  optional TypeAnnotation element_type = 2;     // For ptr/ref/array: element type
  repeated TypeAnnotation param_types = 3;      // For fn/lambda: parameter types
  optional TypeAnnotation return_type = 4;      // For fn/lambda: return type
  repeated TypeAnnotation type_arguments = 5;   // For generics: Vec<i32>
  repeated uint64 array_dimensions = 6;         // For arrays: array<T, 5, 3>
  bool can_error = 7;                           // Error union: T, IError
  bool const_ref = 8;                           // `const ref T`
  bool ref_env = 9;                             // `<'_>() => T` lambda type
  string lifetime_name = 10;                    // `<'a>` / `ref 'a T`
  repeated string lifetime_arguments = 11;      // `Bus<'a>` application
}

// How a lambda takes hold of a variable (mirrors CaptureKind in ast_common.h)
enum CaptureKind {
  CAPTURE_BY_VALUE = 0;  // Not in the capture list: a copy it may only read
  CAPTURE_OWNED = 1;     // [x]: the closure owns it; a compound moves in
  CAPTURE_BORROW = 2;    // [ref x], or [const ref x] when is_const
}

// Lambda capture (mirrors Capture in ast_common.h)
message Capture {
  reserved 3, 5;  // was by_ref / owned, now folded into kind
  string name = 1;
  bool is_const = 4;  // The binding is immutable inside the lambda
  CaptureKind kind = 6;
}

// Token kind enumeration (mirrors TokenKind in lexer.h)
// Only includes kinds used in AST (operators, literals)
enum TokenKind {
  TOKEN_KIND_UNKNOWN = 0;
  
  // Operators
  TOKEN_KIND_PLUS = 1;
  TOKEN_KIND_MINUS = 2;
  TOKEN_KIND_STAR = 3;
  TOKEN_KIND_SLASH = 4;
  TOKEN_KIND_LESS = 5;
  TOKEN_KIND_LESS_EQUAL = 6;
  TOKEN_KIND_GREATER = 7;
  TOKEN_KIND_GREATER_EQUAL = 8;
  TOKEN_KIND_EQUAL_EQUAL = 9;
  TOKEN_KIND_NOT_EQUAL = 10;
  TOKEN_KIND_EQUAL = 11;
  TOKEN_KIND_AND = 12;
  TOKEN_KIND_OR = 13;
  TOKEN_KIND_NOT = 14;
  TOKEN_KIND_AMPERSAND = 15;
  TOKEN_KIND_PIPE = 16;
  TOKEN_KIND_CARET = 17;
  TOKEN_KIND_PERCENT = 18;
  TOKEN_KIND_SHIFT_LEFT = 19;
  TOKEN_KIND_SHIFT_RIGHT = 20;
  TOKEN_KIND_TILDE = 21;
  TOKEN_KIND_PLUS_ASSIGN = 22;
  TOKEN_KIND_MINUS_ASSIGN = 23;
  TOKEN_KIND_STAR_ASSIGN = 24;
  TOKEN_KIND_SLASH_ASSIGN = 25;
  TOKEN_KIND_PERCENT_ASSIGN = 26;
  TOKEN_KIND_AMP_ASSIGN = 27;
  TOKEN_KIND_PIPE_ASSIGN = 28;
  TOKEN_KIND_CARET_ASSIGN = 29;
  TOKEN_KIND_SHIFT_LEFT_ASSIGN = 30;
  TOKEN_KIND_SHIFT_RIGHT_ASSIGN = 31;
}

// Token for operators in binary/unary expressions
message Token {
  TokenKind kind = 1;
  string text = 2;  // Original text representation
}
