// ast.proto — All AST node messages for serialization
// Colocated with AST node headers

syntax = "proto3";

/** Groups the serialized compiler data defined by this schema. */
package sun.proto.ast;

import "types.proto";

option cc_enable_arenas = true;

// =============================================================================
// Root wrapper for polymorphic AST nodes
// =============================================================================

/**
 * Declaration visibility. Sun is private by default; `public` is the only
 * modifier. Zero value = PRIVATE keeps older serialized data valid.
 */
enum Visibility {
  PRIVATE = 0;
  PUBLIC = 1;
}

/**
 * Portable declarations are exported explicitly; ordinary AST clones omit them.
 */
message DeclarationIdentity {
  string key = 1;
  repeated string parameters = 2;
  repeated string type_parameters = 3;
  repeated string lifetime_parameters = 4;
}

/** Wraps a syntax node with its source position and declaration identity for serialization. */
message ASTNode {
  DeclarationIdentity declaration_identity = 102;
  // Canonical module identity for expressions and retained using targets.
  optional string module_declaration_key = 101;
  uint64 source_file_id = 100;
  Position location = 1;
  bool precompiled = 2;
  bool skip_codegen = 3;
  string symbol_prefix = 4;
  
  oneof node {
    // Literals
    NumberExpr number_expr = 10;
    StringLiteral string_literal = 11;
    NullLiteral null_literal = 12;
    BoolLiteral bool_literal = 13;
    ArrayLiteral array_literal = 14;
    StructLiteral struct_literal = 16;
    InterpolatedString interpolated_string = 15;
    CharLiteral char_literal = 17;
    
    // Indexing/slicing
    SliceExpr slice_expr = 20;
    IndexExpr index_expr = 21;
    ArrayIndexExpr array_index_expr = 22;
    
    // Variables and assignment
    VariableReference variable_reference = 30;
    VariableCreation variable_creation = 31;
    VariableAssignment variable_assignment = 32;
    ReferenceCreation reference_creation = 33;
    IndexedAssignment indexed_assignment = 34;
    MemberAssignment member_assignment = 35;
    CompoundAssignment compound_assignment = 36;
    
    // Expressions
    BinaryExpr binary_expr = 40;
    UnaryExpr unary_expr = 41;
    PackExpansion pack_expansion = 42;
    TernaryExpr ternary_expr = 43;
    ParenExpr paren_expr = 44;
    
    // Control flow
    BlockExpr block_expr = 50;
    IfExpr if_expr = 51;
    MatchExpr match_expr = 52;
    ForExpr for_expr = 53;
    ForInExpr for_in_expr = 54;
    WhileExpr while_expr = 55;
    BreakStmt break_stmt = 56;
    ContinueStmt continue_stmt = 57;
    ReturnExpr return_expr = 58;
    UnsafeBlock unsafe_block = 59;
    
    // Functions and calls
    FunctionDef function_def = 60;
    LambdaExpr lambda_expr = 61;
    CallExpr call_expr = 62;
    GenericCallExpr generic_call_expr = 63;
    // 64 was SpawnExpr, before `spawn` became a stdlib function. Left retired
    // so a stale bundle carrying it is ignored rather than misread.

    // Modules/imports/names
    Manifest manifest = 70;
    ManifestSunDependency  manifest_sun_dep = 71;
    ManifestMoonDependency manifest_moon_dep = 72;
    ModuleDef module_def = 73;
    UsingStmt using_stmt = 74;
    QualifiedNameExpr qualified_name = 75;
    
    // Definitions
    ClassDef class_def = 80;
    InterfaceDef interface_def = 81;
    EnumDef enum_def = 82;
    ThisExpr this_expr = 83;
    MemberAccess member_access = 84;
    
    // Error handling / type declarations
    TryCatch try_catch = 90;
    ThrowExpr throw_expr = 91;
    DeclareType declare_type = 92;
  }
}

// =============================================================================
// Literal nodes
// =============================================================================

/** Stores number expression data in the compiler serialization format. */
message NumberExpr {
  oneof value {
    // Absolute value of an integer literal; spans the whole u64 range
    uint64 int_magnitude = 1;
    double float_value = 2;
  }
  // Type suffix written on the literal ("u8", "f32"); empty when untyped
  string suffix = 3;
  // True for a negative integer literal (a minus folded into -128i8)
  bool int_negative = 4;
}

/** Stores string literal data in the compiler serialization format. */
message StringLiteral {
  // Escape sequences can produce arbitrary bytes, including invalid UTF-8.
  bytes value = 1;
}

/** Stores null literal data in the compiler serialization format. */
message NullLiteral {
  // No fields needed
}

/** Stores bool literal data in the compiler serialization format. */
message BoolLiteral {
  bool value = 1;
}

/**
 * 'a' (a char) or b'a' (a u8).
 */
message CharLiteral {
  uint32 value = 1;   // Unicode scalar value, or the byte
  bool is_byte = 2;   // true for b'a'
}

/** Stores array literal data in the compiler serialization format. */
message ArrayLiteral {
  repeated ASTNode elements = 1;
}

/** Stores struct field init data in the compiler serialization format. */
message StructFieldInit {
  string name = 1;
  ASTNode value = 2;
  optional Position location = 3;
}

/**
 * Struct literal: { color: "red", speed: 120 }
 */
message StructLiteral {
  repeated StructFieldInit fields = 1;
}

/**
 * Template string segment: literal run or ${...} expression
 */
message InterpolatedSegment {
  bool is_literal = 1;
  string raw_text = 2;      // Exact source slice (escapes unprocessed)
  string cooked_text = 3;   // Literal segments: escape-processed text
  optional ASTNode expression = 4;  // Expression segments
  int32 source_offset = 5;  // Absolute byte offset of the segment start
}

/**
 * Template string: `text ${expr}` (parse tree only; lowered before analysis)
 */
message InterpolatedString {
  string raw_content = 1;   // Inner text, backticks stripped, unprocessed
  repeated InterpolatedSegment segments = 2;
}

// =============================================================================
// Indexing/slicing nodes
// =============================================================================

/** Stores slice expression data in the compiler serialization format. */
message SliceExpr {
  optional ASTNode start = 1;
  optional ASTNode end = 2;
  bool is_range = 3;  // true for start:end, false for single index
}

/** Stores index expression data in the compiler serialization format. */
message IndexExpr {
  ASTNode target = 1;
  repeated SliceExpr indices = 2;  // SliceExpr for each dimension
}

/** Stores array index expression data in the compiler serialization format. */
message ArrayIndexExpr {
  // Legacy array index node
  ASTNode array = 1;
  repeated ASTNode indices = 2;
}

// =============================================================================
// Variable nodes
// =============================================================================

/** Stores variable reference data in the compiler serialization format. */
message VariableReference {
  string name = 1;
}

/** Stores variable creation data in the compiler serialization format. */
message VariableCreation {
  DeclarationIdentity declaration_identity = 102;
  uint64 source_file_id = 100;
  string name = 1;
  optional ASTNode value = 2;
  optional TypeAnnotation type_annotation = 3;
  Visibility visibility = 4;  // module-level globals only
  bool is_const = 5;          // `const x = ...`
  string doc = 6;             // Comment written above the declaration
  bool is_c_extern = 7;       // Declared with extern var
  optional string link_name = 8;  // Native symbol from an as clause
  bool explicit_c_abi = 9;  // Source spelled the optional "C" ABI
  // Bundle metadata only: the value of a `const` known at compile time
  optional ConstantValue constant_value = 10;
}

/**
 * A value the compiler computed for a global, carried so an importing program
 * can use it at compile time: as an array size, or in the initializer of one
 * of its own constants. The type is the global's own; an integer is its low
 * `bit_width` bits and a float is its IEEE bit pattern, so both survive
 * exactly.
 */
message ConstantValue {
  oneof value {
    uint64 integer_bits = 1;
    uint64 float_bits = 2;
    bytes text = 3;
    ConstantArray array = 4;
  }
  uint32 bit_width = 5;  // integers and floats
}

/** The elements of an array value; a further dimension nests. */
message ConstantArray {
  repeated ConstantValue elements = 1;
}

/** Stores variable assignment data in the compiler serialization format. */
message VariableAssignment {
  string name = 1;
  ASTNode value = 2;
}

/** Stores reference creation data in the compiler serialization format. */
message ReferenceCreation {
  string name = 1;
  ASTNode target = 2;
  bool is_mutable = 3;
}

/** Stores indexed assignment data in the compiler serialization format. */
message IndexedAssignment {
  ASTNode target = 1;  // The index expression
  ASTNode value = 2;
}

/** Stores member assignment data in the compiler serialization format. */
message MemberAssignment {
  ASTNode object = 1;
  string member_name = 2;
  ASTNode value = 3;
}

/** Stores compound assignment data in the compiler serialization format. */
message CompoundAssignment {
  ASTNode target = 1;  // Lvalue expression (variable / member / index)
  Token op = 2;        // The compound token (+=, -=, ...)
  ASTNode value = 3;
}

// =============================================================================
// Expression nodes
// =============================================================================

/** Stores binary expression data in the compiler serialization format. */
message BinaryExpr {
  Token op = 1;
  ASTNode lhs = 2;
  ASTNode rhs = 3;
}

/** Stores ternary expression data in the compiler serialization format. */
message TernaryExpr {
  ASTNode cond = 1;
  ASTNode then_expr = 2;
  ASTNode else_expr = 3;
}

/**
 * Grouping parentheses: (expr) (parse tree only; lowered before analysis)
 */
message ParenExpr {
  ASTNode inner = 1;
}

/** Stores unary expression data in the compiler serialization format. */
message UnaryExpr {
  Token op = 1;
  ASTNode operand = 2;
}

/** Stores pack expansion data in the compiler serialization format. */
message PackExpansion {
  string pack_name = 1;
}

// =============================================================================
// Control flow nodes
// =============================================================================

/** Stores block expression data in the compiler serialization format. */
message BlockExpr {
  uint64 source_file_id = 100;
  repeated ASTNode body = 1;
  optional Position location = 2;  // Span of the braces
  // Which construct this block is the body of; values mirror the C++
  // BlockKind enum (0 = Anonymous). Decides whether the block may evaluate
  // to its last statement.
  optional uint32 block_kind = 3;
}

/** Stores if expression data in the compiler serialization format. */
message IfExpr {
  ASTNode condition = 1;
  ASTNode then_branch = 2;
  optional ASTNode else_branch = 3;
}

/**
 * A payload binding position in a destructuring pattern: Shape.Circle(r, _)
 */
message PatternBinding {
  DeclarationIdentity declaration_identity = 102;
  string name = 1;  // empty when is_wildcard
  bool is_wildcard = 2;
  Position location = 3;
}

/** Stores match arm data in the compiler serialization format. */
message MatchArm {
  optional ASTNode pattern = 1;  // null for wildcard (_)
  bool is_wildcard = 2;
  ASTNode body = 3;
  bool has_payload_parens = 4;
  repeated PatternBinding bindings = 5;
}

/** Stores match expression data in the compiler serialization format. */
message MatchExpr {
  ASTNode discriminant = 1;
  repeated MatchArm arms = 2;
}

/** Stores for expression data in the compiler serialization format. */
message ForExpr {
  optional ASTNode init = 1;
  optional ASTNode condition = 2;
  optional ASTNode increment = 3;
  ASTNode body = 4;
}

/** Stores for in expression data in the compiler serialization format. */
message ForInExpr {
  string loop_var = 1;
  TypeAnnotation loop_var_type = 2;
  ASTNode iterable = 3;
  ASTNode body = 4;
  bool is_const = 5;  // `for (const x: T in ...)`
}

/** Stores while expression data in the compiler serialization format. */
message WhileExpr {
  ASTNode condition = 1;
  ASTNode body = 2;
}

/** Stores break statement data in the compiler serialization format. */
message BreakStmt {
  // No fields needed
}

/** Stores continue statement data in the compiler serialization format. */
message ContinueStmt {
  // No fields needed
}

/** Stores return expression data in the compiler serialization format. */
message ReturnExpr {
  optional ASTNode value = 1;
}

/** Stores unsafe block data in the compiler serialization format. */
message UnsafeBlock {
  BlockExpr body = 1;
  bool expression_form = 2;
}

// =============================================================================
// Function/call nodes
// =============================================================================

/**
 * Function argument (name + type)
 */
message FunctionArg {
  string name = 1;
  TypeAnnotation type = 2;
}

/**
 * One generic type parameter: a name, and optionally a constraint the type
 * argument must satisfy (a built-in trait, an interface, or `lambda`).
 * Mirrors TypeParameter/TypeConstraint. User-defined constraints retain the
 * exact interface identity alongside their source spelling.
 */
message TypeParameter {
  optional string declaration_key = 3;
  string name = 1;
  optional string constraint = 2;
  repeated TypeAnnotation constraint_arguments = 4;
}

/**
 * Function prototype (signature)
 */
message Prototype {
  DeclarationIdentity declaration_identity = 102;
  string name = 1;
  // Superseded by type_params; still read so bundles built before
  // constraints existed keep loading.
  repeated string type_parameters = 2 [deprecated = true];
  repeated FunctionArg args = 3;
  optional TypeAnnotation return_type = 4;
  reserved 5;  // Computed captures belong to analysis, not source syntax.
  reserved "captures";
  // The trailing `args...` value pack: its name, and the annotation after its
  // colon in `args...: _params_of<T>`.
  optional string variadic_param_name = 6;
  optional TypeAnnotation variadic_type_annotation = 7;
  repeated string ref_captures = 8;  // Declared [ref x, ...] capture list
  optional Position location = 9;    // Source span of the signature
  bool c_variadic = 11;             // C-style trailing `...`
  optional string link_name = 12;   // `as "c_symbol"` override
  bool is_unsafe_method = 19;       // Calls require an unsafe block.
  bool is_const_method = 13;        // `const function`: `this` is immutable
  string doc = 14;                  // Comment written above the function
  // The subset of ref_captures declared `[const ref x]` (read-only borrow)
  repeated string const_ref_captures = 15;
  // Capture list entries written without `ref`: the closure owns them
  repeated string owned_captures = 16;
  repeated TypeParameter type_params = 17;  // <T, U: _Numeric>
  repeated string lifetime_params = 18;     // <'a, T> declares 'a
}

/** Stores function definition data in the compiler serialization format. */
message FunctionDef {
  uint64 source_file_id = 100;
  Prototype proto = 1;
  BlockExpr body = 2;
  string source_text = 3;  // Original source for generic specialization
  // A bodyless `extern "C" function`. Without this the declaration comes back
  // as an ordinary Sun function with an empty body and is emitted under a
  // Sun-derived symbol, so the C symbol is lost.
  bool is_c_extern = 4;
  bool body_present = 5;  // Distinguishes "no body" from "empty body"
  Visibility visibility = 6;
  // Span of the whole declaration, for functions stored without a node
  // wrapper: class and interface methods, and .moon bundle exports
  optional Position location = 7;
  // A `test_function`. Without this a clone or bundle roundtrip would hand
  // back an ordinary function, and the test would leak into production builds.
  bool is_test = 8;
  uint64 field_initializer_count = 9;
  bool synthesized_constructor = 10;
}

/** Stores lambda expression data in the compiler serialization format. */
message LambdaExpr {
  Prototype proto = 1;
  BlockExpr body = 2;
}

/** Stores call expression data in the compiler serialization format. */
message CallExpr {
  ASTNode callee = 1;
  repeated ASTNode args = 2;
}

/** Stores generic call expression data in the compiler serialization format. */
message GenericCallExpr {
  string function_name = 1;
  repeated TypeAnnotation type_arguments = 2;
  repeated ASTNode args = 3;
}

// =============================================================================
// Module/import nodes
// =============================================================================

/** Stores import statement data in the compiler serialization format. */
message ImportStmt {
  string path = 1;
}

/** Stores import scope data in the compiler serialization format. */
message ImportScope {
  string source_file = 1;
  string content_hash = 2;
  BlockExpr body = 3;
}

/** Stores manifest moon dependency data in the compiler serialization format. */
message ManifestMoonDependency {
  string path = 1;
  optional string hash = 2;
  optional string rename_module = 3;
  optional string url = 4;
}

/** Stores manifest sun dependency data in the compiler serialization format. */
message ManifestSunDependency {
  string path = 1;
  optional string hash = 2;
}

/** Stores manifest proto dependency data in the compiler serialization format. */
message ManifestProtoDependency {
  string path = 1;
}

/** Stores manifest data in the compiler serialization format. */
message Manifest {
  repeated ManifestSunDependency suns = 1;
  repeated ManifestMoonDependency moons = 2;
  repeated ManifestProtoDependency protos = 3;
}

/** Stores module definition data in the compiler serialization format. */
message ModuleDef {
  DeclarationIdentity declaration_identity = 102;
  string name = 1;
  BlockExpr body = 2;
  Visibility visibility = 3;
  string doc = 4;
  Position name_location = 5;
}

/** Stores using statement data in the compiler serialization format. */
message UsingStmt {
  repeated string namespace_path = 1;  // ["ModuleName", "SubModule"]
  string target = 2;                   // "funcName" or "*"
  bool is_module_import = 3;
}

/**
 * A dotted name as written in a source expression.
 */
message QualifiedNameExpr {
  repeated string parts = 1;  // ["Module", "SubModule", "name"]
}

// =============================================================================
// Class/interface/enum definitions
// =============================================================================

/**
 * Class field declaration
 */
message ClassField {
  DeclarationIdentity declaration_identity = 102;
  optional ASTNode initializer = 6;
  string name = 1;
  TypeAnnotation type = 2;
  Position location = 3;
  Visibility visibility = 4;
  string doc = 5;  // Comment written above the field
}

/**
 * Class method declaration
 */
message ClassMethod {
  FunctionDef function = 1;
  bool is_constructor = 2;  // true if method name is "init"
  bool is_const = 3;        // `const function`: does not mutate `this`
}

/**
 * Implemented interface with type arguments
 */
message ImplementedInterface {
  optional string declaration_key = 3;
  string name = 1;
  repeated TypeAnnotation type_arguments = 2;
}

/** Stores compiled specialization data in the compiler serialization format. */
message CompiledSpecialization {
  string declaration_key = 1;
  repeated string method_symbols = 2;
}

/** Stores class definition data in the compiler serialization format. */
message ClassDef {
  DeclarationIdentity declaration_identity = 102;
  uint64 source_file_id = 100;
  string name = 1;
  repeated string type_parameters = 2 [deprecated = true];  // see type_params
  repeated ImplementedInterface implemented_interfaces = 3;
  repeated ClassField fields = 4;
  repeated ClassMethod methods = 5;
  bool is_partial = 6;
  bool is_packed = 7;  // packed_class: fields laid out with no padding
  Visibility visibility = 8;
  string doc = 9;  // Comment written above the class
  optional Position location = 10;  // Declaration span (bundle exports only)
  repeated TypeParameter type_params = 11;  // <T, U: _Numeric>
  repeated string lifetime_params = 12;     // class Bus<'a, 'b>
  // Concrete class shapes whose ordinary methods are present in the bundle.
  repeated CompiledSpecialization compiled_specializations = 13;
}

/**
 * Interface field declaration
 */
message InterfaceField {
  DeclarationIdentity declaration_identity = 102;
  string name = 1;
  TypeAnnotation type = 2;
  Position location = 3;
  Visibility visibility = 4;
  string doc = 5;  // Comment written above the field
}

/**
 * Interface method declaration
 */
message InterfaceMethod {
  FunctionDef function = 1;
  bool has_default_impl = 2;
  bool is_const = 3;  // `const function`: does not mutate `this`
}

/** Stores interface definition data in the compiler serialization format. */
message InterfaceDef {
  DeclarationIdentity declaration_identity = 102;
  uint64 source_file_id = 100;
  string name = 1;
  repeated string type_parameters = 2 [deprecated = true];  // see type_params
  repeated InterfaceField fields = 3;
  repeated InterfaceMethod methods = 4;
  Visibility visibility = 5;
  string doc = 6;  // Comment written above the interface
  optional Position location = 7;  // Declaration span (bundle exports only)
  repeated TypeParameter type_params = 8;  // <T, U: _Numeric>
  repeated string lifetime_params = 9;     // interface ISink<'a>
  optional TypeAnnotation parent = 10;
}

/**
 * Enum variant declaration
 */
message EnumVariant {
  DeclarationIdentity declaration_identity = 102;
  string name = 1;
  int64 value = 2;
  Position location = 3;
  repeated TypeAnnotation payload_types = 4;  // empty = unit variant
  string doc = 5;  // Comment written above the variant
  bool has_explicit_value = 6;
}

/** Stores enum definition data in the compiler serialization format. */
message EnumDef {
  DeclarationIdentity declaration_identity = 102;
  uint64 source_file_id = 100;
  string name = 1;
  repeated EnumVariant variants = 2;
  repeated string type_parameters = 3 [deprecated = true];  // see type_params
  Visibility visibility = 4;
  string doc = 5;  // Comment written above the enum
  optional Position location = 6;  // Declaration span (bundle exports only)
  repeated TypeParameter type_params = 7;  // <T, U: _Numeric>
  string underlying_type = 8;  // Empty means the default integer representation
}

/** Stores this expression data in the compiler serialization format. */
message ThisExpr {
  // No fields needed
}

/** Stores member access data in the compiler serialization format. */
message MemberAccess {
  ASTNode object = 1;
  string member_name = 2;
  repeated TypeAnnotation type_arguments = 3;  // For generic method calls
}

// =============================================================================
// Error handling / type declaration nodes
// =============================================================================

/** Stores catch clause data in the compiler serialization format. */
message CatchClause {
  DeclarationIdentity declaration_identity = 102;
  string binding_name = 1;
  optional TypeAnnotation binding_type = 2;
  BlockExpr body = 3;
}

/** Stores try catch data in the compiler serialization format. */
message TryCatch {
  BlockExpr try_block = 1;
  repeated CatchClause catch_clauses = 2;
}

/** Stores throw expression data in the compiler serialization format. */
message ThrowExpr {
  ASTNode error_expr = 1;
}

/** Stores declare type data in the compiler serialization format. */
message DeclareType {
  optional string alias_name = 1;
  TypeAnnotation type_annotation = 2;
  Visibility visibility = 3;
}

// =============================================================================
// Top-level program message
// =============================================================================

/** Stores program data in the compiler serialization format. */
message Program {
  uint32 version = 1;  // Schema version for compatibility
  BlockExpr body = 2;  // Root block containing all declarations
}
