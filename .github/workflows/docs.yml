name: Docs

# Publishes only after BuildAndTest passes on main, so the site never
# documents a commit whose tests failed. workflow_run carries no path filter,
# so this rebuilds on every green main push rather than only on docs changes —
# a rebuild of unchanged content republishes the same site harmlessly,
# whereas a missed filter would leave the site stale.
#
# The trigger matches the other workflow by its `name:` field, not its file
# name, so renaming it there means renaming it here too — otherwise this
# workflow simply stops running, with nothing to see in the Actions tab.
on:
  workflow_run:
    workflows: [BuildAndTest]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The commit CI tested; on a workflow_run event the default
          # checkout would take the default branch's head instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
