name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # All jobs build and publish the commit selected for this run.
  BUILD_SHA: ${{ github.sha }}

jobs:
  # Runs independently; benchmark failures do not gate tests or packages.
  string-creation-benchmark:
    name: String creation benchmark (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CXX: clang++-20
      MPLCONFIGDIR: ${{ github.workspace }}/tmp/string-creation-ci/matplotlib
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install LLVM 20 from its signed APT repository
        run: |
          mkdir -p tmp/string-creation-ci
          curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o tmp/string-creation-ci/llvm-key.asc
          echo '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  tmp/string-creation-ci/llvm-key.asc' | sha256sum --check
          gpg --batch --dearmor --output tmp/string-creation-ci/llvm-key.gpg tmp/string-creation-ci/llvm-key.asc
          sudo install -m 644 tmp/string-creation-ci/llvm-key.gpg /usr/share/keyrings/llvm-benchmark.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-benchmark.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/llvm-benchmark.list
          sudo apt-get update
          sudo apt-get install -y clang-20 llvm-20-dev lld-20 libzstd-dev ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: benchmark-clang20
          max-size: 2G

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.3'
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Set up Rust and Nim
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
          mkdir -p tmp/string-creation-tools
          curl --fail --location --retry 3 \
            https://github.com/nim-lang/nightlies/releases/download/2026-09-23-version-2-2-597822ac8a695a9530ddd53c7f93b06201053028/nim-2.2.13-linux_x64.tar.xz \
            -o tmp/string-creation-tools/nim.tar.xz
          echo '79b4877c3e3817bbd75463759aa03f280711d22aab0006ab917130dede277eee  tmp/string-creation-tools/nim.tar.xz' | sha256sum --check
          tar -xJf tmp/string-creation-tools/nim.tar.xz -C tmp/string-creation-tools
          echo "${GITHUB_WORKSPACE}/tmp/string-creation-tools/nim-2.2.13/bin" >> "$GITHUB_PATH"

      - name: Build Sun
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DSKIP_STDLIB=ON
          cmake --build build --target sun -j2 2>&1 | tee tmp/string-creation-ci/compiler-build.log

      - name: Run all languages on one CPU
        run: |
          BENCHMARK_CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          python3 benchmarks/string-creation/run.py \
            --cpu "$BENCHMARK_CPU" --output tmp/string-creation-ci \
            2>&1 | tee tmp/string-creation-ci/run.log

      - name: Plot results
        run: |
          python3 -m pip install -r benchmarks/string-creation/requirements.txt
          python3 benchmarks/string-creation/plot.py \
            tmp/string-creation-ci/results.json tmp/string-creation-ci/strings.png

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f tmp/string-creation-ci/results.md ]; then
            echo '### String creation benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo 'Informational only. Hosted-runner hardware and load vary between runs.' >> "$GITHUB_STEP_SUMMARY"
            cat tmp/string-creation-ci/results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'String creation benchmark did not finish. See the job logs and available artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: string-creation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/string-creation-ci/*.json
            tmp/string-creation-ci/*.md
            tmp/string-creation-ci/*.png
            tmp/string-creation-ci/*.log
          if-no-files-found: ignore
          retention-days: 30

  build-and-test:
    runs-on: ubuntu-24.04

    env:
      # Required for ccache to cache compilations that use precompiled headers
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install LLVM 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y llvm-20-dev lld-20 libzstd-dev libgtest-dev ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ci-clang20
          max-size: 2G

      - name: Cache static OpenSSL archives
        uses: actions/cache@v5
        with:
          path: third_party/openssl
          key: openssl-static-${{ hashFiles('scripts/fetch-openssl.sh') }}

      - name: Fetch static OpenSSL
        # tls.moon embeds these; without them CMake skips the bundle and the
        # TLS tests and the https_client example have nothing to link against.
        run: |
          if [ ! -f third_party/openssl/x86_64-linux-musl/libcrypto.a ]; then
            ./scripts/fetch-openssl.sh
          fi

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Check tls.moon was built
        # The example skips itself when the bundle is missing; without this
        # a failed fetch would look like a pass.
        run: test -f build/tls.moon

      - name: Test
        run: |
          cd build
          ctest -j$(nproc) --output-on-failure
        env:
          SUN_PATH: ${{ github.workspace }}

      - name: Run stdlib Sun tests
        # The stdlib's own suite (stdlib/*_tests.sun), AOT-compiled to
        # build/stdlib_tests_test by the CMake build. ctest above already runs
        # it as one entry and hides its output on success; this step runs it
        # again so every test's PASS/FAIL line is in the log, and fails
        # loudly if the binary was never built. Sequential, as in ctest: the
        # env and cwd tests change process-wide state.
        run: |
          test -x build/stdlib_tests_test
          build/stdlib_tests_test --test-sequential

      - name: Run tls Sun tests
        # The tls bundle's suite (tls/*_tests.sun), AOT-compiled to
        # build/tls_tests_test alongside tls.moon. Same visible rerun as the
        # stdlib's; sequential because the handshake tests set SSL_CERT_FILE,
        # which is process-wide.
        run: |
          test -x build/tls_tests_test
          build/tls_tests_test --test-sequential

      - name: Add compiler to PATH
        # Examples call the bare `sun` binary; expose the freshly built one.
        # A separate step so the PATH change takes effect in the next step.
        run: echo "${GITHUB_WORKSPACE}/build" >> "$GITHUB_PATH"

      - name: Verify examples compile & execute
        run: |
          set -euo pipefail
          fail=0
          for dir in examples/*/; do
            [ -f "${dir}build.sh" ] || continue
            name=$(basename "$dir")
            echo "::group::${name}"
            if ( cd "$dir" && bash build.sh && bash test.sh ); then
              echo "PASS ${name}"
            else
              echo "::error::example '${name}' failed to compile or execute"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  # Native macOS (Apple Silicon): builds the compiler with Homebrew LLVM and
  # runs the suite and examples on real hardware — the things the Linux job's
  # cross-compilation tests cannot execute.
  build-and-test-macos:
    runs-on: macos-latest

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        # No OpenSSL package: the tls bundle carries its own static build
        # (scripts/build-openssl-macos.sh), and the JIT loads the carried
        # archives just as the AOT link does.
        run: brew install llvm@20 ninja ccache googletest

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ci-macos-clang20
          max-size: 2G

      - name: Cache static OpenSSL archives
        uses: actions/cache@v5
        with:
          path: third_party/openssl
          key: openssl-macos-${{ hashFiles('scripts/build-openssl-macos.sh') }}

      - name: Build static OpenSSL
        # tls.moon embeds these; without them CMake skips the bundle and the
        # TLS tests and the https_client example have nothing to link against.
        # The script exits fast when the cache already holds the archives.
        run: ./scripts/build-openssl-macos.sh

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm@20)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@20)/bin/clang++" \
            -DLLVM_DIR="$(brew --prefix llvm@20)/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j4

      - name: Check tls.moon was built
        # The example skips itself when the bundle is missing; without this
        # a failed OpenSSL build would look like a pass.
        run: test -f build/tls.moon

      - name: Test
        run: |
          cd build
          ctest -j4 --output-on-failure
        env:
          SUN_PATH: ${{ github.workspace }}

      - name: Run stdlib Sun tests
        # Same as the Linux job: a visible run of stdlib/*_tests.sun on real
        # macOS hardware, sequential because the env and cwd tests change
        # process-wide state.
        run: |
          test -x build/stdlib_tests_test
          build/stdlib_tests_test --test-sequential

      - name: Run tls Sun tests
        # Same as the Linux job, on real macOS hardware. Sequential because
        # the handshake tests set SSL_CERT_FILE, which is process-wide.
        run: |
          test -x build/tls_tests_test
          build/tls_tests_test --test-sequential

      - name: Add compiler to PATH
        run: echo "${GITHUB_WORKSPACE}/build" >> "$GITHUB_PATH"

      - name: Verify examples compile & execute
        run: |
          set -euo pipefail
          fail=0
          for dir in examples/*/; do
            [ -f "${dir}build.sh" ] || continue
            name=$(basename "$dir")
            echo "::group::${name}"
            if ( cd "$dir" && bash build.sh && bash test.sh ); then
              echo "PASS ${name}"
            else
              echo "::error::example '${name}' failed to compile or execute"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  build-deb:
    needs: [build-and-test, build-and-test-macos]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    env:
      # Required for ccache to cache compilations that use precompiled headers
      CCACHE_SLOPPINESS: pch_defines,time_macros
      # The build runs in a random mktemp dir; don't hash the cwd or every
      # run misses the cache (dpkg buildflags include -g, which triggers it)
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0  # Full history and tags for version detection

      # The build scripts read the version from an exact-match tag on HEAD,
      # so use the same check for both push and manual runs.
      - name: Detect release tag
        id: release
        run: |
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          case "$tag" in
            v[0-9]*) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *)       echo "tag=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install LLVM 20 and build dependencies
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            llvm-20-dev \
            libzstd-dev \
            devscripts \
            debhelper \
            build-essential

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: deb-gcc
          max-size: 2G

      - name: Build Debian package
        run: |
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Record Debian package name
        id: deb
        run: |
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%f\n')
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one Debian package, found ${#packages[@]}" >&2
            exit 1
          fi
          echo "name=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-deb-package-${{ env.BUILD_SHA }}
          path: dist/*
          retention-days: 30

      - name: Upload to release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # Use the detected tag, including for manual runs on a branch.
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist/*
          body: |
            Install the Linux package:

            ```bash
            curl -fL "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/${{ steps.deb.outputs.name }}" -o "/tmp/${{ steps.deb.outputs.name }}" && chmod 0644 "/tmp/${{ steps.deb.outputs.name }}"
            sudo apt install "/tmp/${{ steps.deb.outputs.name }}" && rm -f "/tmp/${{ steps.deb.outputs.name }}"
            ```

            The temporary path is reachable by APT's restricted `_apt` user, and mode `0644` handles restrictive user umasks.

            The `.deb` installs the compiler and both bundles on Linux; on
            macOS that is what `brew install namo-robotics/sun/sun` installs,
            from the `.tar.gz` here. The `.moon` files are the same bundles on
            their own, for dropping next to an existing compiler; each is
            named for the target it was built for. Install one under its
            canonical name in a bundle search directory:

            ```bash
            # Linux
            mv stdlib-x86_64-linux-gnu.moon /usr/lib/sun/stdlib.moon
            mv tls-x86_64-linux-gnu.moon    /usr/lib/sun/tls.moon
            # macOS
            mv stdlib-arm64-apple-darwin.moon "$(brew --prefix)/lib/sun/stdlib.moon"
            mv tls-arm64-apple-darwin.moon    "$(brew --prefix)/lib/sun/tls.moon"
            ```

            A bundle built for another architecture is rejected at link time,
            so take the one matching your target.

            On an Apple Silicon Mac, Homebrew is the whole install — it
            pulls in `llvm@20`, the compiler's one runtime dependency:

            ```bash
            brew install namo-robotics/sun/sun
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev release
        if: steps.release.outputs.tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          files: dist/*
          body: |
            Latest development build from main branch.

            Commit: ${{ env.BUILD_SHA }}

            Install the Linux package:

            ```bash
            curl -fL "https://github.com/${{ github.repository }}/releases/download/dev/${{ steps.deb.outputs.name }}" -o "/tmp/${{ steps.deb.outputs.name }}" && chmod 0644 "/tmp/${{ steps.deb.outputs.name }}"
            sudo apt install "/tmp/${{ steps.deb.outputs.name }}" && rm -f "/tmp/${{ steps.deb.outputs.name }}"
            ```

            The temporary path is reachable by APT's restricted `_apt` user, and mode `0644` handles restrictive user umasks.

            The `.deb` installs the compiler and both bundles on Linux; on
            macOS that is what `brew install namo-robotics/sun/sun` installs,
            from the `.tar.gz` here. The `.moon` files are the same bundles on
            their own, for dropping next to an existing compiler; each is
            named for the target it was built for. Install one under its
            canonical name in a bundle search directory:

            ```bash
            # Linux
            mv stdlib-x86_64-linux-gnu.moon /usr/lib/sun/stdlib.moon
            mv tls-x86_64-linux-gnu.moon    /usr/lib/sun/tls.moon
            # macOS
            mv stdlib-arm64-apple-darwin.moon "$(brew --prefix)/lib/sun/stdlib.moon"
            mv tls-arm64-apple-darwin.moon    "$(brew --prefix)/lib/sun/tls.moon"
            ```

            A bundle built for another architecture is rejected at link time,
            so take the one matching your target.

            On an Apple Silicon Mac, Homebrew is the whole install — it
            pulls in `llvm@20`, the compiler's one runtime dependency:

            ```bash
            brew install namo-robotics/sun/sun
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-install:
    needs: build-deb
    runs-on: ubuntu-24.04
    # A bare container, not the runner image: the runner ships gcc, libc6-dev
    # and libstdc++-dev already, so a missing Depends would go unnoticed there.
    # Here everything `sun -c` needs has to come from the package's own deps.
    container: ubuntu:24.04

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sun-deb-package-${{ env.BUILD_SHA }}
          path: dist/

      - name: Install LLVM 20 runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget ca-certificates gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 20

      - name: Install package
        run: |
          apt-get update

          private_dir=$(mktemp -d)
          chmod 0700 "$private_dir"
          deb=$(mktemp /tmp/sun.XXXXXX.deb)
          log=$(mktemp)
          trap 'rm -r "$private_dir"; rm -f "$deb" "$log"' EXIT

          cp ./dist/*.deb "$deb"
          chmod 0644 "$deb"
          cd "$private_dir"

          # APT (not dpkg) verifies that the package metadata pulls every
          # dependency needed on a clean base image.
          apt-get install -y --no-install-recommends "$deb" 2>&1 | tee "$log"
          if grep -Fq "Download is performed unsandboxed as root" "$log"; then
            echo "APT could not read the package through its _apt sandbox" >&2
            exit 1
          fi

      - name: Test installation
        run: |
          which sun
          sun --help || true
          # Test with stdlib import (stdlib.moon installed to /usr/lib/sun/)
          cat > test.sun << 'EOF'
          using std;
          function main() i32 {
              println("Hello from Sun!");
              return 0;
          }
          manifest {
              libraries: ["stdlib.moon"]
          }
          EOF
          unset SUN_PATH
          sun test.sun
          # AOT: needs a C link driver (cc), libc6-dev and libstdc++ dev files
          sun -c -o test_aot test.sun
          ./test_aot
          # TLS: tls.moon carries its own static OpenSSL, so this needs no
          # libssl installed and no linker flags.
          cat > tls_test.sun << 'EOF'
          using std;
          using tls;
          function main() i32 {
              var alloc = make_heap_allocator();
              var client = HttpsClient(alloc);
              var host = String(alloc, "example.com");
              try {
                  var resp = client.get(host, "/");
                  println(resp.status);
                  if (resp.status == 200) { return 0; }
                  return 1;
              } catch (e: ref IError) {
                  var msg = e.message();
                  println(msg);
                  return 2;
              }
          }
          manifest {
              libraries: ["stdlib.moon", "tls.moon"]
          }
          EOF
          sun -c --dynamic -o tls_aot tls_test.sun
          ./tls_aot

      - name: Test installed AArch64 bundles
        run: |
          apt-get install -y --no-install-recommends \
            g++-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu
          unset SUN_PATH
          test -f /usr/lib/sun/aarch64-linux-gnu/stdlib.moon
          test -f /usr/lib/sun/aarch64-linux-gnu/tls.moon
          test -f /usr/lib/sun/aarch64-linux-musl/tls.moon
          for target in aarch64-linux-gnu aarch64-linux-musl; do
            sun --emit-obj --target "$target" -o "stdlib-$target.o" test.sun
            sun --emit-obj --target "$target" -o "tls-$target.o" tls_test.sun
            aarch64-linux-gnu-readelf -h "stdlib-$target.o" | grep 'Machine:.*AArch64'
            aarch64-linux-gnu-readelf -h "tls-$target.o" | grep 'Machine:.*AArch64'
          done
          sun -c --target aarch64-linux-gnu -o tls_aarch64 tls_test.sun
          aarch64-linux-gnu-readelf -h tls_aarch64 | grep 'Machine:.*AArch64'

  # The deb's macOS counterpart: a tarball of the same files, which the
  # Homebrew formula unpacks. Like the deb depends on apt's libllvm20, the
  # binary links Homebrew's LLVM, so `brew install llvm@20` is its one
  # runtime dependency. This job uploads the tarball and the standalone
  # tls-arm64-apple-darwin.moon (tls needs Darwin OpenSSL archives, which
  # only this runner can build); the Darwin stdlib bundle still comes from
  # the deb job's cross builds.
  build-macos:
    needs: [build-and-test, build-and-test-macos]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: macos-latest

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0  # Full history and tags for version detection

      # The build scripts read the version from an exact-match tag on HEAD,
      # so use the same check for both push and manual runs.
      - name: Detect release tag
        id: release
        run: |
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          case "$tag" in
            v[0-9]*) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *)       echo "tag=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install dependencies
        run: brew install llvm@20 ninja ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: build-macos
          max-size: 2G

      - name: Cache static OpenSSL archives
        uses: actions/cache@v5
        with:
          path: third_party/openssl
          key: openssl-macos-${{ hashFiles('scripts/build-openssl-macos.sh') }}

      - name: Build static OpenSSL
        # tls.moon embeds these. The script exits fast on a cache hit.
        run: ./scripts/build-openssl-macos.sh

      - name: Build macOS release
        run: |
          chmod +x ./scripts/build-macos.sh
          CMAKE_EXTRA_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" \
            ./scripts/build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-macos-${{ env.BUILD_SHA }}
          path: |
            dist/*.tar.gz
            dist/*.moon
          retention-days: 30

      # No body on either upload: the deb job owns the release notes, and
      # setting one here would race it.
      - name: Upload to release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # Use the detected tag, including for manual runs on a branch.
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.moon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev release
        if: steps.release.outputs.tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.moon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-install-macos:
    needs: build-macos
    runs-on: macos-latest
    # A fresh runner rather than the build job's workspace: everything the
    # installed compiler needs has to come from the tarball plus its one
    # declared dependency.

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sun-macos-${{ env.BUILD_SHA }}
          path: dist/

      - name: Install LLVM 20 runtime
        run: brew install llvm@20

      # Unpacked into a prefix of its own, the way the formula installs it
      # into the Cellar. Nothing goes anywhere system-wide, so the only thing
      # that can find the bundles is the compiler's search of ../lib/sun
      # relative to its own binary.
      - name: Install the tarball
        run: |
          mkdir -p "$HOME/cellar"
          tar -xzf dist/*.tar.gz -C "$HOME/cellar"
          echo "$HOME/cellar/bin" >> "$GITHUB_PATH"

      - name: Test installation
        run: |
          which sun
          sun --help || true
          # JIT with the stdlib import, and no SUN_PATH.
          cat > test.sun << 'PROGRAM'
          using std;
          function main() i32 {
              println("Hello from Sun!");
              return 0;
          }
          manifest {
              libraries: ["stdlib.moon"]
          }
          PROGRAM
          sun test.sun
          # AOT: links through Apple's cc with -lc++.
          sun -c -o test_aot test.sun
          ./test_aot
          # TLS: tls.moon carries its own static OpenSSL, so this needs no
          # libssl installed and no linker flags. A real fetch also proves
          # certificate verification finds the CA bundle stock macOS ships
          # at /etc/ssl/cert.pem.
          cat > tls_test.sun << 'PROGRAM'
          using std;
          using tls;
          function main() i32 {
              var alloc = make_heap_allocator();
              var client = HttpsClient(alloc);
              var host = String(alloc, "example.com");
              try {
                  var resp = client.get(host, "/");
                  println(resp.status);
                  if (resp.status == 200) { return 0; }
                  return 1;
              } catch (e: ref IError) {
                  var msg = e.message();
                  println(msg);
                  return 2;
              }
          }
          manifest {
              libraries: ["stdlib.moon", "tls.moon"]
          }
          PROGRAM
          sun -c -o tls_aot tls_test.sun
          ./tls_aot

  # Points the Homebrew tap at the build that just passed its install test.
  # A formula has to carry a checksum and the rolling dev tarball's changes on
  # every push, so the formula is re-rendered from homebrew/sun.rb.in and
  # pushed each time rather than edited by hand in the tap.
  update-tap:
    needs: [build-macos, test-install-macos]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0  # Full history and tags for version detection

      # Writing to another repository needs a token of its own; the built-in
      # GITHUB_TOKEN is scoped to this one. Without the secret the job says so
      # and stops, leaving the tap on the formula it already has.
      - name: Check for tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_TOKEN is not set; namo-robotics/homebrew-sun was left unchanged"
          fi

      - name: Download artifact
        if: steps.tap.outputs.have == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: sun-macos-${{ env.BUILD_SHA }}
          path: dist/

      - name: Render formula
        if: steps.tap.outputs.have == 'yes'
        run: |
          tarball=$(ls dist/sun-*-arm64-apple-darwin.tar.gz)
          sha=$(sha256sum "$tarball" | cut -d' ' -f1)
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          case "$tag" in
            v[0-9]*)
              version="${tag#v}"
              release="$tag"
              ;;
            *)
              # A dev build keeps its 0.dev file name but gets a unique
              # formula version: Homebrew names its download cache after the
              # version, so a new file under the old version would be served
              # from a stale cache and fail its checksum.
              version="0.dev.$(date -u +%Y%m%d%H%M%S)"
              release="dev"
              ;;
          esac
          url="https://github.com/${{ github.repository }}/releases/download/$release/$(basename "$tarball")"
          sed -e "s|@URL@|$url|" -e "s|@VERSION@|$version|" -e "s|@SHA256@|$sha|" \
            homebrew/sun.rb.in > sun.rb
          echo "version=$version" >> "$GITHUB_ENV"
          cat sun.rb

      - name: Push to the tap
        if: steps.tap.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          repo=namo-robotics/homebrew-sun
          # Replacing a file through the API needs the blob it replaces.
          blob=$(gh api "repos/$repo/contents/Formula/sun.rb" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$repo/contents/Formula/sun.rb" \
            -f message="sun $version" \
            -f content="$(base64 -w0 sun.rb)" \
            ${blob:+-f sha="$blob"}

  # Publish main's docs only after every package job succeeds.
  docs:
    needs: [build-deb, test-install, build-macos, test-install-macos, update-tap]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install Doxygen
        working-directory: .
        run: |
          mkdir -p tmp/doxygen
          curl --fail --location --retry 3 https://www.doxygen.nl/files/doxygen-1.15.0.linux.bin.tar.gz -o tmp/doxygen/archive.tar.gz
          echo "0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1  tmp/doxygen/archive.tar.gz" | sha256sum --check
          tar -xzf tmp/doxygen/archive.tar.gz -C tmp/doxygen
          echo "$GITHUB_WORKSPACE/tmp/doxygen/doxygen-1.15.0/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Test documentation generators
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
