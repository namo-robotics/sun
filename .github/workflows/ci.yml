name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y llvm-20-dev libzstd-dev libgtest-dev protobuf-compiler libprotobuf-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: |
          cd build
          ctest --output-on-failure
        env:
          SUN_PATH: ${{ github.workspace }}

      - name: Add compiler to PATH
        # Examples call the bare `sun` binary; expose the freshly built one.
        # A separate step so the PATH change takes effect in the next step.
        run: echo "${GITHUB_WORKSPACE}/build" >> "$GITHUB_PATH"

      - name: Verify examples compile & execute
        run: |
          set -euo pipefail
          fail=0
          for dir in examples/*/; do
            [ -f "${dir}build.sh" ] || continue
            name=$(basename "$dir")
            echo "::group::${name}"
            if ( cd "$dir" && bash build.sh && bash test.sh ); then
              echo "PASS ${name}"
            else
              echo "::error::example '${name}' failed to compile or execute"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
