name: Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'  # Sequential version tags: v0, v1, v2, ...
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    env:
      # Required for ccache to cache compilations that use precompiled headers
      CCACHE_SLOPPINESS: pch_defines,time_macros
      # The build runs in a random mktemp dir; don't hash the cwd or every
      # run misses the cache (dpkg buildflags include -g, which triggers it)
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Install LLVM 20 and build dependencies
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            llvm-20-dev \
            libzstd-dev \
            devscripts \
            debhelper \
            build-essential

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: deb-gcc
          max-size: 2G

      - name: Build Debian package
        run: |
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-deb-package-${{ github.sha }}
          path: dist/*
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            The `.deb` and the `.pkg` each install the compiler and both
            bundles. The `.moon` files are the same bundles on their own, for
            dropping next to an existing compiler; each is named for the
            target it was built for. Install one under its canonical name in
            a bundle search directory:

            ```bash
            # Linux
            mv stdlib-x86_64-linux-gnu.moon /usr/lib/sun/stdlib.moon
            mv tls-x86_64-linux-gnu.moon    /usr/lib/sun/tls.moon
            # macOS
            mv stdlib-arm64-apple-darwin.moon /usr/local/lib/sun/stdlib.moon
            mv tls-arm64-apple-darwin.moon    /usr/local/lib/sun/tls.moon
            ```

            A bundle built for another architecture is rejected at link time,
            so take the one matching your target.

            On an Apple Silicon Mac, install the `.pkg` (after `brew install
            llvm@20`, its one runtime dependency):

            ```bash
            sudo installer -pkg sun-*-arm64-apple-darwin.pkg -target /
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev release
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          files: dist/*
          body: |
            Latest development build from main branch.

            Commit: ${{ github.sha }}

            The `.deb` and the `.pkg` each install the compiler and both
            bundles. The `.moon` files are the same bundles on their own, for
            dropping next to an existing compiler; each is named for the
            target it was built for. Install one under its canonical name in
            a bundle search directory:

            ```bash
            # Linux
            mv stdlib-x86_64-linux-gnu.moon /usr/lib/sun/stdlib.moon
            mv tls-x86_64-linux-gnu.moon    /usr/lib/sun/tls.moon
            # macOS
            mv stdlib-arm64-apple-darwin.moon /usr/local/lib/sun/stdlib.moon
            mv tls-arm64-apple-darwin.moon    /usr/local/lib/sun/tls.moon
            ```

            A bundle built for another architecture is rejected at link time,
            so take the one matching your target.

            On an Apple Silicon Mac, install the `.pkg` (after `brew install
            llvm@20`, its one runtime dependency):

            ```bash
            sudo installer -pkg sun-*-arm64-apple-darwin.pkg -target /
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-install:
    needs: build-deb
    runs-on: ubuntu-24.04
    # A bare container, not the runner image: the runner ships gcc, libc6-dev
    # and libstdc++-dev already, so a missing Depends would go unnoticed there.
    # Here everything `sun -c` needs has to come from the package's own deps.
    container: ubuntu:24.04

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sun-deb-package-${{ github.sha }}
          path: dist/

      - name: Install LLVM 20 runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget ca-certificates gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 20

      - name: Install package
        run: |
          apt-get update
          # apt (not dpkg) so the package's declared Depends are resolved.
          apt-get install -y --no-install-recommends ./dist/*.deb

      - name: Test installation
        run: |
          which sun
          sun --help || true
          # Test with stdlib import (stdlib.moon installed to /usr/lib/sun/)
          cat > test.sun << 'EOF'
          using sun;
          function main() i32 {
              println("Hello from Sun!");
              return 0;
          }
          manifest {
              moons: ["stdlib.moon"]
          }
          EOF
          export SUN_PATH=/usr/lib/sun
          sun test.sun
          # AOT: needs a C link driver (cc), libc6-dev and libstdc++ dev files
          sun -c -o test_aot test.sun
          ./test_aot
          # TLS: tls.moon carries its own static OpenSSL, so this needs no
          # libssl installed and no linker flags.
          cat > tls_test.sun << 'EOF'
          using sun;
          using tls;
          function main() i32 {
              var alloc = make_heap_allocator();
              var client = HttpsClient(alloc);
              var host = String(alloc, "example.com");
              try {
                  var resp = client.get(host, "/");
                  println(resp.status);
                  if (resp.status == 200) { return 0; }
                  return 1;
              } catch (e: IError) {
                  var msg = e.message();
                  println(msg);
                  return 2;
              }
          }
          manifest {
              moons: ["stdlib.moon", "tls.moon"]
          }
          EOF
          sun -c --dynamic -o tls_aot tls_test.sun
          ./tls_aot

  # The deb's macOS counterpart: an unsigned .pkg installing to /usr/local
  # (sudo installer -pkg works without Gatekeeper friction). Like the deb
  # depends on apt's libllvm20, the binary links Homebrew's LLVM, so
  # `brew install llvm@20` is the package's one runtime dependency. This job
  # uploads the .pkg and the standalone tls-arm64-apple-darwin.moon (tls
  # needs Darwin OpenSSL archives, which only this runner can build); the
  # Darwin stdlib bundle still comes from the deb job's cross builds.
  build-pkg-macos:
    runs-on: macos-latest

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Install dependencies
        run: brew install llvm@20 ninja ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: pkg-macos
          max-size: 2G

      - name: Cache static OpenSSL archives
        uses: actions/cache@v4
        with:
          path: third_party/openssl
          key: openssl-macos-${{ hashFiles('scripts/build-openssl-macos.sh') }}

      - name: Build static OpenSSL
        # tls.moon embeds these. The script exits fast on a cache hit.
        run: ./scripts/build-openssl-macos.sh

      - name: Build macOS package
        run: |
          chmod +x ./scripts/build-pkg-macos.sh
          CMAKE_EXTRA_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" \
            ./scripts/build-pkg-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-pkg-macos-${{ github.sha }}
          path: |
            dist/*.pkg
            dist/*.moon
          retention-days: 30

      # No body on either upload: the deb job owns the release notes, and
      # setting one here would race it.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg
            dist/*.moon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev release
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          files: |
            dist/*.pkg
            dist/*.moon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-install-macos:
    needs: build-pkg-macos
    runs-on: macos-latest
    # A fresh runner rather than the build job's workspace: everything the
    # installed compiler needs has to come from the package plus its one
    # declared dependency.

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sun-pkg-macos-${{ github.sha }}
          path: dist/

      - name: Install LLVM 20 runtime
        run: brew install llvm@20

      - name: Install package
        run: sudo installer -pkg dist/*.pkg -target /

      - name: Test installation
        run: |
          which sun
          sun --help || true
          # JIT with the stdlib import. No SUN_PATH: /usr/local/lib/sun is
          # on the compiler's built-in bundle search path.
          cat > test.sun << 'PROGRAM'
          using sun;
          function main() i32 {
              println("Hello from Sun!");
              return 0;
          }
          manifest {
              moons: ["stdlib.moon"]
          }
          PROGRAM
          sun test.sun
          # AOT: links through Apple's cc with -lc++.
          sun -c -o test_aot test.sun
          ./test_aot
          # TLS: tls.moon carries its own static OpenSSL, so this needs no
          # libssl installed and no linker flags. A real fetch also proves
          # certificate verification finds the CA bundle stock macOS ships
          # at /etc/ssl/cert.pem.
          cat > tls_test.sun << 'PROGRAM'
          using sun;
          using tls;
          function main() i32 {
              var alloc = make_heap_allocator();
              var client = HttpsClient(alloc);
              var host = String(alloc, "example.com");
              try {
                  var resp = client.get(host, "/");
                  println(resp.status);
                  if (resp.status == 200) { return 0; }
                  return 1;
              } catch (e: IError) {
                  var msg = e.message();
                  println(msg);
                  return 2;
              }
          }
          manifest {
              moons: ["stdlib.moon", "tls.moon"]
          }
          PROGRAM
          sun -c -o tls_aot tls_test.sun
          ./tls_aot
