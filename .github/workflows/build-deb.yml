name: Debian Package

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'  # Sequential version tags: v0, v1, v2, ...
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    env:
      # Required for ccache to cache compilations that use precompiled headers
      CCACHE_SLOPPINESS: pch_defines,time_macros
      # The build runs in a random mktemp dir; don't hash the cwd or every
      # run misses the cache (dpkg buildflags include -g, which triggers it)
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Install LLVM 20 and build dependencies
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            llvm-20-dev \
            libzstd-dev \
            devscripts \
            debhelper \
            build-essential

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: deb-gcc
          max-size: 2G

      - name: Build Debian package
        run: |
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-deb-package-${{ github.sha }}
          path: dist/*
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            The `.deb` installs the compiler and both bundles. The `.moon`
            files are the same bundles on their own, for dropping next to an
            existing compiler; each is named for the target it was built for.
            Install one under its canonical name in a bundle search directory:

            ```bash
            mv stdlib-x86_64-linux-gnu.moon /usr/lib/sun/stdlib.moon
            mv tls-x86_64-linux-gnu.moon    /usr/lib/sun/tls.moon
            ```

            A bundle built for another architecture is rejected at link time,
            so take the one matching your target.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev release
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          files: dist/*
          body: |
            Latest development build from main branch.

            Commit: ${{ github.sha }}

            The `.deb` installs the compiler and both bundles. The `.moon`
            files are the same bundles on their own, for dropping next to an
            existing compiler; each is named for the target it was built for.
            Install one under its canonical name in a bundle search directory:

            ```bash
            mv stdlib-x86_64-linux-gnu.moon /usr/lib/sun/stdlib.moon
            mv tls-x86_64-linux-gnu.moon    /usr/lib/sun/tls.moon
            ```

            A bundle built for another architecture is rejected at link time,
            so take the one matching your target.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-install:
    needs: build-deb
    runs-on: ubuntu-24.04
    # A bare container, not the runner image: the runner ships gcc, libc6-dev
    # and libstdc++-dev already, so a missing Depends would go unnoticed there.
    # Here everything `sun -c` needs has to come from the package's own deps.
    container: ubuntu:24.04

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sun-deb-package-${{ github.sha }}
          path: dist/

      - name: Install LLVM 20 runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget ca-certificates gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 20

      - name: Install package
        run: |
          apt-get update
          # apt (not dpkg) so the package's declared Depends are resolved.
          apt-get install -y --no-install-recommends ./dist/*.deb

      - name: Test installation
        run: |
          which sun
          sun --help || true
          # Test with stdlib import (stdlib.moon installed to /usr/lib/sun/)
          cat > test.sun << 'EOF'
          using sun;
          function main() i32 {
              println("Hello from Sun!");
              return 0;
          }
          manifest {
              moons: ["stdlib.moon"]
          }
          EOF
          export SUN_PATH=/usr/lib/sun
          sun test.sun
          # AOT: needs a C link driver (cc), libc6-dev and libstdc++ dev files
          sun -c -o test_aot test.sun
          ./test_aot
          # TLS: tls.moon carries its own static OpenSSL, so this needs no
          # libssl installed and no linker flags.
          cat > tls_test.sun << 'EOF'
          using sun;
          using tls;
          function main() i32 {
              var alloc = make_heap_allocator();
              var client = HttpsClient(alloc);
              var host = String(alloc, "example.com");
              try {
                  var resp = client.get(host, "/");
                  println(resp.status);
                  if (resp.status == 200) { return 0; }
                  return 1;
              } catch (e: IError) {
                  var msg = e.message();
                  println(msg);
                  return 2;
              }
          }
          manifest {
              moons: ["stdlib.moon", "tls.moon"]
          }
          EOF
          sun -c --dynamic -o tls_aot tls_test.sun
          ./tls_aot
